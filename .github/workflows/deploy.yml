name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Build and push image
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
          docker build -t ${{ secrets.ECR_REGISTRY }}/pricefeed:latest app/
          docker push ${{ secrets.ECR_REGISTRY }}/pricefeed:latest

      - name: Deploy infrastructure
        run: |
          npm install
          npx cdk deploy --all --require-approval never

      - name: Force new deployment
        run: |
          aws ecs update-service --cluster $(aws ecs list-clusters --query 'clusterArns[0]' --output text) \
            --service $(aws ecs list-services --cluster $(aws ecs list-clusters --query 'clusterArns[0]' --output text) --query 'serviceArns[0]' --output text) \
            --force-new-deployment
